[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "brainbeacon"
version = "0.0.1"
description = "A cross-species foundation model for single-cell resolved brain spatial transcriptomics"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Chengming Zhang", email = "zhangchengming.utokyo@gmail.com" },
]
authors = [
  { name = "BrainBeacon Team" },
]
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.11",
  "numpy>=1.24",
  "pandas>=1.5",
  "scipy>=1.10",
  "h5py>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.60",
  "scikit-learn>=1.2",
  "umap-learn>=0.5",
  "numba>=0.57",
  "scanpy>=1.9",
  "torch>=2.0",
  "torchmetrics>=1.0",
  "einops>=0.6",
  "networkx>=3.0",
  "matplotlib>=3.7",
  "pillow>=10.0",
  "pyarrow>=12",
  "session-info2>=0.1.2",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://BrainBeacon.readthedocs.io/"
urls.Homepage = "https://github.com/ChengmingZhang-CAS/BrainBeacon"
urls.Source = "https://github.com/ChengmingZhang-CAS/BrainBeacon"

[project.optional-dependencies]
doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-parser",
  "myst-nb>=1.1",
  # Until pybtex >0.24.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxcontrib-katex",
  "sphinxext-opengraph",
]
bio = [
  "mygene>=3.2.2",
]
[tool.hatch.envs.hatch-test]
# Optional: keep test deps here (pytest, coverage, etc.) if your template expects it
# dependencies = ["pytest", "pytest-cov", "coverage[toml]"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10"]

[tool.ruff]
line-length = 120
src = [ "brainbeacon" ]
extend-include = [ "*.ipynb" ]

[tool.ruff.format]
docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  # "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "B905", # zip() without explicit strict= (too noisy for now)
  # "D100", # Missing docstring in public module
  # "D104", # Missing docstring in public package
  # "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  # "D107", # Missing docstring in __init__
  # # Disable one in each pair of mutually incompatible rules
  # "D203", # We don’t want a blank line before a class docstring
  # "D213", # <> We want docstrings to start immediately after the opening triple quote
  # "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  # "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
# lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
strict = true
testpaths = [ "tests" ]
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "brainbeacon" ]
patch = [ "subprocess" ]
omit = [
  "**/test_*.py",
]

[tool.cruft]
skip = [
  "tests",
  "brainbeacon/**/__init__.py",
  "brainbeacon/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
