# Runtime I/O
pretrain_ckpt: /path/to/brainbeacon_checkpoint.pt
gene_dict_path: /path/to/brainbeacon_gene_dict.h5ad
token_data_path_template: /path/to/token_dirs/{index}_{adata_stem}_bb_token_dir
output_h5ad_template: /path/to/output_h5ad/{index}_{adata_stem}_with_bb_emb.h5ad
obsm_key: bb_emb
device: cuda:0

# Tokenization
use_hvg: true
n_hvg: 1000
force_tokenize: true
use_dev_abs: false

# Optional tokenization metadata overrides.
# If omitted, inference_main.py will try:
# 1. tokenize_*_by_path
# 2. tokenize_* global value
# 3. metadata inside each h5ad
# 4. path-based inference
#    The current inference_main.py treats any path under `/private/` as `stereo`.
# tokenize_specie: mouse
# tokenize_assay: merfish
# tokenize_specie_by_path:
#   /abs/path/sample_a.h5ad: human
# tokenize_assay_by_path:
#   sample_a.h5ad: xenium

# Model
dim_model: 1024
nheads: 16
dim_feedforward: 1024
nlayers: 16
dropout: 0.1
n_tokens: 92076
n_connect_comp: 46502
n_aux: 20
n_rna_type: 33
num_neighbors: 4
context_length: 1000

# ESM embedding
use_esm_embedding: true
ems_embedding_dim: 5120
esm_embedding_path: /cpfs01/projects-HDD/cfff-c7cd658afc74_HDD/public/BrainST_pretrain/esm2_embeddings_d5120.pt

# Task
autoregressive: false
pool: null
supervised_task: false
learnable_pe: true
organ: everything
specie: true
assay: true
modality: false
contrastive: false
neighbor_enhance: true
gene_id: true

# Additional BrainBeacon switches
use_pos_emb: true
use_density_emb: true
density_token_idx: 2

# Tokenization filters for inference
min_genes: 0
min_cells: 3

# Inference performance
token_batch_size: 1024
data_loader_batch_size: 1
dataloader_num_workers: 4
joblib_cache_size: 2
pin_memory: true
persistent_workers: true
prefetch_factor: 2
inference_amp: true
amp_dtype: float16

# Training/inference shared fields kept for compatibility.
# `batch_size` here is kept only for backward compatibility.
batch_size: 16
lr: 1.0e-5
warmup: 1000
max_epoch: 100
total_steps: 100000
root_path: /cpfs01/projects-HDD/cfff-c7cd658afc74_HDD/public/BrainST
