# Continue training config
# Based on train_default.yaml, with lr=1e-6 and pretrain_ckpt set

# Model
dim_model: 1024
nheads: 16
dim_feedforward: 1024
nlayers: 16
dropout: 0.1
n_tokens: 92076
n_connect_comp: 46714
n_aux: 20
n_rna_type: 33
num_neighbors: 4
context_length: 1000

# ESM embedding
use_esm_embedding: true
ems_embedding_dim: 5120
esm_embedding_path: /cpfs01/projects-HDD/cfff-c7cd658afc74_HDD/public/BrainST_pretrain/esm2_embeddings_d5120.pt

# Training
batch_size: 16
lr: 1.0e-6
warmup: 1000
max_epoch: 100
total_steps: 100000

# Task
autoregressive: false
pool: null
supervised_task: false
learnable_pe: true
organ: everything
specie: true
assay: true
modality: false
contrastive: false
neighbor_enhance: true
gene_id: true

# Paths
root_path: /cpfs01/projects-HDD/cfff-c7cd658afc74_HDD/public/BrainST
pretrain_ckpt: /cpfs01/projects-HDD/cfff-c7cd658afc74_HDD/public/BrainST_impu/epoch_0_step_800000.pt

# Masking
masking_p: 0.15
batch_first: true
